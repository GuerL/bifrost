name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional compatibility input; must match the selected version tag ref
        required: false
        type: string

permissions: {}

# Serialize publication, including manual retries; never cancel a running release.
concurrency:
  group: bifrost-release
  cancel-in-progress: false

jobs:
  validate-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.publication.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve and validate exact tagged commit
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          REQUIRE_TAG_REF: 'true'
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_TAG_REF" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
              echo "::error::Release must be dispatched using an existing version tag as its ref."
              exit 1
            fi
            if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$TAG" ]; then
              echo "::error::Tag input must match the workflow reference."
              exit 1
            fi
          fi
          git check-ref-format "refs/tags/$TAG"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "refs/tags/$TAG"
          object=$(git rev-parse FETCH_HEAD)
          sha=$(git rev-parse --verify "FETCH_HEAD^{commit}")
          if [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Remote tag commit does not match the expected commit."
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release tags must point to commits reachable from main."
            exit 1
          }
          # The tagged workflow must be exactly the reviewed orchestration configuration.
          git show "$sha:.github/workflows/release.yml" > "$RUNNER_TEMP/tagged-release.yml"
          cmp .github/workflows/release.yml "$RUNNER_TEMP/tagged-release.yml"
          VALIDATION_REF="$sha" EXPECTED_TAG="$TAG" CHECK_REMOTE=true SKIP_PUBLISHED=true RELEASE_ELIGIBILITY=true node scripts/validate-version.js
          remote_object=$(git ls-remote --refs origin "refs/tags/$TAG" | cut -f1)
          if [ "$remote_object" != "$object" ]; then
            echo "::error::Tag moved during validation."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Skip already published releases
        id: publication
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.TAG,
              });
              core.setOutput('publish', release.draft || !release.published_at ? 'true' : 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }

  publish-tauri:
    needs: validate-tag
    if: always() && needs.validate-tag.result == 'success' && needs.validate-tag.outputs.publish == 'true'
    permissions:
      contents: write
    timeout-minutes: 60
    name: Build and Publish (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-26
            args: ""
            tauri_timeout: 45
          - label: macOS Intel
            runner: macos-26-intel
            args: ""
            tauri_timeout: 45
          - label: Windows
            runner: windows-latest
            args: "--config src-tauri/tauri.windows.conf.json"
            tauri_timeout: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate macOS build toolchain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Detected macOS SDK: ${sdk_version}"
          sdk_major="${sdk_version%%.*}"
          if [ "${sdk_major}" -lt 26 ]; then
            echo "::error::macOS SDK ${sdk_version} is too old. Expected SDK 26+ for visual parity with local builds."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Notarization preflight (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          echo "Checking notarytool availability..."
          xcrun notarytool --version
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::One or more Apple notarization secrets are missing."
          else
            echo "Apple notarization credentials are configured."
          fi

      - name: Build and publish release artifacts (Tauri action)
        id: tauri_release
        uses: tauri-apps/tauri-action@v0.6.2
        timeout-minutes: ${{ matrix.tauri_timeout }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing/notarization secrets used by tauri-action on macOS.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: GuerL
          repo: bifrost
          tagName: ${{ needs.validate-tag.outputs.tag }}
          releaseName: Bifrost ${{ needs.validate-tag.outputs.tag }}
          releaseBody: See the assets to download and install this version.
          releaseDraft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Remove updater signature assets from release
        if: always()
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.tauri_release.outputs.releaseId }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID || 0);
            if (!releaseId) {
              core.warning("No releaseId was produced; skipping .sig asset cleanup.");
              return;
            }

            const { owner, repo } = context.repo;
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner,
                repo,
                release_id: releaseId,
                per_page: 100,
              }
            );

            const sigAssets = assets.filter(asset => asset.name.endsWith(".sig"));

            if (sigAssets.length === 0) {
              core.info("No .sig assets found on this release.");
              return;
            }

            for (const asset of sigAssets) {
              core.info(`Deleting release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

            core.info(`Deleted ${sigAssets.length} .sig release asset(s).`);
      - name: Notarization diagnostics (macOS, always)
        if: runner.os == 'macOS' && always()
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          diag_dir="${RUNNER_TEMP}/notarytool-diagnostics"
          mkdir -p "$diag_dir"

          echo "notarytool version:"
          xcrun notarytool --version || true

          echo "Fetching notarization history from Apple..."
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$diag_dir/history.json"
          history_exit=$?
          if [ "$history_exit" -ne 0 ]; then
            echo "::warning::Unable to fetch notarization history (exit $history_exit)."
            exit 0
          fi

          cat "$diag_dir/history.json"
          latest_submission_id="$(sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$diag_dir/history.json" | head -n 1)"
          if [ -z "$latest_submission_id" ]; then
            echo "::warning::No notarization submission id found in history output."
            exit 0
          fi

          echo "Fetching notarization log for submission: $latest_submission_id"
          xcrun notarytool log "$latest_submission_id" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$diag_dir/log-$latest_submission_id.json" || \
            echo "::warning::Unable to fetch notarization log for submission $latest_submission_id."

          echo "Notarization diagnostic files:"
          ls -la "$diag_dir"

      - name: Upload notarization diagnostics (macOS)
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: notarytool-diagnostics-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/notarytool-diagnostics
          retention-days: 7
          if-no-files-found: ignore
